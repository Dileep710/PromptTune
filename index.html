<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PromptTune — Smart Prompt Refinement Studio</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet"/>
</head>
<body>

  <!-- Ambient background orbs -->
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <div class="page-wrapper">

    <!-- Header -->
    <header class="header">
      <div class="badge">✦ AI Studio</div>
      <h3 class="title">PromptTune <span class="title-accent">Prompt Enhancer</span></h3>
      <p class="subtitle">Transform vague prompts into precise, powerful instructions.</p>
    </header>

    <!-- Main card -->
    <main class="card">

      <!-- Input zone -->
      <div class="input-section">
        <div class="input-controls">
          <div class="control-group">
            <label class="control-label">Template</label>
            <select id="templateSelect" class="template-select">
              <option value="">Select Template</option>
              <option value="explain">Explain Concept</option>
              <option value="email">Write Email</option>
              <option value="code">Generate Code</option>
            </select>
          </div>
          <button class="example-btn" id="exampleBtn">Example</button>
        </div>
        <label class="label">
          <span class="label-icon">⌨</span> Your Raw Prompt
        </label>
        <div class="textarea-wrapper">
          <textarea id="promptInput" placeholder="e.g. write me something about marketing…" spellcheck="false"></textarea>
          <div class="char-counter"><span id="charCount">0</span> chars</div>
        </div>

        <!-- Detection badges -->
        <div class="detection-row" id="detectionRow">
          <span class="det-badge missing" id="det-role">◎ Role</span>
          <span class="det-badge missing" id="det-task">◎ Task Clarity</span>
          <span class="det-badge missing" id="det-constraint">◎ Constraints</span>
        </div>

        <button class="btn-improve" id="improveBtn">
          <span class="btn-text">Improve Prompt</span>
          <span class="btn-icon">→</span>
          <div class="btn-loader" id="btnLoader"></div>
        </button>
      </div>

      <!-- Results section -->
      <div class="results-section" id="resultsSection">

        <!-- Before / After boxes -->
        <div class="compare-grid">

          <div class="compare-box before-box">
            <div class="box-header">
              <span class="box-label">Before</span>
              <span class="box-tag">Original</span>
              <div class="score-display" id="beforeScore">Score: 0</div>
            </div>
            <div class="box-content" id="beforeContent"></div>
          </div>

          <div class="compare-divider">
            <div class="divider-line"></div>
            <div class="arrow-badge">⟶</div>
            <div class="divider-line"></div>
          </div>

          <div class="compare-box after-box">
            <div class="box-header">
              <span class="box-label">After</span>
              <span class="box-tag">Improved</span>
              <div class="score-display" id="afterScore">Score: 100</div>
              <button class="copy-btn" id="copyBtn" title="Copy improved prompt">
                <span class="copy-icon">⎘</span>
                <span class="copy-text">Copy</span>
              </button>
            </div>
            <div class="box-content" id="afterContent"></div>
          </div>

        </div>

        <!-- Why improved -->
        <div class="why-section">
          <div class="why-header">
            <span class="why-icon">✦</span>
            <h3 class="why-title">Why It Was Improved</h3>
          </div>
          <div class="reasons-grid" id="reasonsGrid"></div>
        </div>

      </div>

    </main>

<footer class="footer">Powered by GROQ · Built by <a href=" target="_blank" rel="noopener noreferrer" style="color: white; text-decoration: none;">DILEEP PRASANTH N Y</a></footer>

  </div>

  <script src="script.js"></script>
</body>
</html>
